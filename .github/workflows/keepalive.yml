name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days without a commit to
# the repo. This checks weekly and, if 30 days have passed since the last
# commit, makes a trivial one — so the sync-portfolio.yml scheduler never
# goes quiet long enough to be disabled.

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit if 30+ days since last commit
        run: |
          days_elapsed=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Days since last commit: $days_elapsed"
          if [ "$days_elapsed" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive [auto]"
            git push
          else
            echo "Nothing to do."
          fi
