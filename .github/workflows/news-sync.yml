name: Sync news feed

# Refreshes news.json (tech, from Hacker News's public keyless API) and
# school-news.json (the "Scuola" category, scraped from uspmc.sinp.net —
# see scripts/fetch-school-news.mjs) once a day and pushes straight to main.
# No AI/API key involved in either fetch.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest tech news
        run: node scripts/fetch-news.mjs

      - name: Fetch latest school news
        run: node scripts/fetch-school-news.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news.json school-news.json
            git commit -m "Update news feed [auto]"
            git push
          else
            echo "Nothing to commit."
          fi
