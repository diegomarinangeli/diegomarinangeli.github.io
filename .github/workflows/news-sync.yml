name: Sync news feed

# Refreshes school-news.json (the "Scuola" category, scraped from
# uspmc.sinp.net — see scripts/fetch-school-news.mjs) once a day and pushes
# straight to main. No AI/API key involved.
#
# The tech fetch (news.json, from Hacker News's public keyless API) is
# commented out below — the Tech pill is disabled in index.html for now,
# so there's nothing reading news.json until it's turned back on.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    # Self-hosted (Diego's own machine) instead of GitHub-hosted: the school
    # site's firewall silently drops connections from GitHub's hosted-runner
    # (Azure) IP ranges — connect ETIMEDOUT, every run, starting 2026-08-03 —
    # while the same fetch works fine from an ordinary residential IP.
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tech fetch is disabled for now — the Tech pill is commented out of
      # the News section in index.html, so there's no consumer for
      # news.json until it comes back.
      # - name: Fetch latest tech news
      #   run: node scripts/fetch-news.mjs

      - name: Fetch latest school news
        run: node scripts/fetch-school-news.mjs

      - name: Commit and push if changed
        # PowerShell, not bash: the self-hosted runner's service account
        # (NETWORK SERVICE) doesn't have Git Bash on its PATH.
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add school-news.json
            git commit -m "Update news feed [auto]"
            git push
          } else {
            Write-Output "Nothing to commit."
          }
