name: Sync news feed

# The whole News section of the site (both Tech and Scuola) is currently
# disabled — see the commented-out <section class="news"> in index.html.
# Both fetch steps below are commented out to match, and the daily
# schedule trigger is commented out too (nothing left for it to refresh).
# workflow_dispatch stays so this can still be run manually if needed. To
# bring News back: uncomment the schedule trigger and whichever fetch
# step(s) apply, alongside index.html's News section/nav link.

on:
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tech section disabled for now on the site itself (see script.js:
      # getMode(), forced to "scuola") — no point refreshing news.json
      # daily while nothing reads it. To bring Tech back, restore this
      # step alongside the other disabled pieces listed in getMode()'s
      # comment.
      # - name: Fetch latest tech news
      #   run: node scripts/fetch-news.mjs

      # School section disabled for now too (see the top-of-file note) —
      # same reasoning as the tech step above.
      # - name: Fetch latest school news
      #   run: node scripts/fetch-school-news.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news.json school-news.json
            git commit -m "Update news feed [auto]"
            git push
          else
            echo "Nothing to commit."
          fi
